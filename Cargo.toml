[workspace]
resolver = "3"
members = ["crates/rail-core", "crates/rail"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vitosans/rail"
homepage = "https://github.com/vitosans/rail"

[workspace.dependencies]
rail-core = { path = "crates/rail-core" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1.1"
toml_edit = "0.25"
directories = "6.0"
keyring = "4.2"
oauth2 = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
async-trait = "0.1.92"
fastrand = "2.5"
httpdate = "1.0.3"
url = "2.5"
regex = "1.11"
percent-encoding = "2.3"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
icu_properties = "2.2"
humantime-serde = "1.1"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3.27"
wiremock = "0.6"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
# Inline pictures in the reader: the terminal's image protocol (kitty, iTerm2, sixel) or half
# blocks, and only the formats `attachment.image` accepts.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mail-parser = { version = "0.11.9", default-features = false }
base64 = "0.23.1"
mail-builder = "2.0.0"
shell-words = "1.1.1"
uuid = { version = "1.26.1", features = ["v4"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
schemars = "1.2.2"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
sha2 = "0.11"
insta = { version = "1.49.0", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
nucleo-matcher = "0.3.1"
signal-hook = { version = "0.4.5", default-features = false }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io", "elicitation", "schemars"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

# Debug info is most of a test binary's size: keep file and line numbers for backtraces in
# Rail's own crates, and none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
# `cargo llvm-cov` builds with `--cfg coverage`; timing tests scale their limits for it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
