version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A malicious release is usually found and yanked within days; wait it out before
    # proposing it. Security updates skip the cooldown.
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # flake.lock: nixpkgs and rust-overlay. A shorter cooldown keeps rust-overlay ahead of the
  # rust-toolchain update above, which needs a lock that knows the new Rust release.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
