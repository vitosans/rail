name: dependabot auto-merge

# Patch and minor updates from Dependabot merge on their own once every required check on
# main passes (the "Protect main" ruleset). Major updates and Rust toolchain updates are
# labelled and wait for a person. Nix flake.lock updates are left to the nix workflow, which
# turns on auto-merge only after the flake builds.
# This job never checks out or runs the pull request's code.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'vitosans/rail'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge patch and minor updates when checks pass
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem != 'rust-toolchain' &&
          steps.metadata.outputs.package-ecosystem != 'nix'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Label major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit "$PR_URL" --add-label "major update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A new compiler can change formatting, lints and code generation, so a person merges it.
      - name: Label Rust toolchain updates for review
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.metadata.outputs.package-ecosystem == 'rust-toolchain'
        run: gh pr edit "$PR_URL" --add-label "toolchain update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
