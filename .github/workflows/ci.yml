name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test coverage badge generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80
      - name: Generate coverage badge
        run: |
          python3 scripts/coverage_badge.py lcov.info --output-dir coverage-badge --commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov
          path: |
            lcov.info
            coverage-badge/coverage.svg
            coverage-badge/coverage.json

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  publish-coverage:
    name: publish coverage badge
    needs: coverage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Download coverage files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov
          path: coverage-artifact
      - name: Publish badge and measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'Skipping coverage for a superseded main commit.'
            exit 0
          fi
          badge_dir="$(mktemp -d)"
          git -C "$badge_dir" init --initial-branch=badges
          git -C "$badge_dir" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git -C "$badge_dir" ls-remote --exit-code --heads origin badges > /dev/null; then
            git -C "$badge_dir" fetch --depth=1 origin badges
            git -C "$badge_dir" checkout -B badges FETCH_HEAD
          fi
          cp coverage-artifact/coverage-badge/coverage.svg coverage-artifact/coverage-badge/coverage.json "$badge_dir/"
          git -C "$badge_dir" add coverage.svg coverage.json
          if git -C "$badge_dir" diff --cached --quiet; then
            exit 0
          fi
          git -C "$badge_dir" config user.name 'github-actions[bot]'
          git -C "$badge_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$badge_dir" commit -m "chore: coverage for $GITHUB_SHA"
          gh auth setup-git --hostname github.com --force
          git -C "$badge_dir" push origin HEAD:refs/heads/badges
