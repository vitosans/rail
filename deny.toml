[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "0BSD", "MPL-2.0", "CC0-1.0", "OpenSSL", "Unlicense", "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
# These standalone crates were folded into zbus 6, not reported vulnerable.
# keyring 4.2's Linux backend still requires zbus 5. Remove these when the
# keyring backend migrates to zbus 6. Keep vulnerability and other advisory checks.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant: transitive keyring dependency; migration requires zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: transitive keyring dependency; migration requires zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: transitive keyring dependency; migration requires zbus 6" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils: unmaintained-crate advisory, not a vulnerability; transitive async-imap dependency; upstream repository archived" },
]

[bans]
multiple-versions = "allow"
