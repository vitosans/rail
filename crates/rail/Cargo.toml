[package]
name = "rail"
description = "Modern email. Native to your terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "rail"
path = "src/main.rs"

[dependencies]
rail-core.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap.workspace = true
color-eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
url.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ratatui-image.workspace = true
image.workspace = true
futures-util.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
rustix.workspace = true
thiserror.workspace = true
shell-words.workspace = true
toml_edit.workspace = true

[target.'cfg(unix)'.dependencies]
# Already in the tree through crossterm; its safe `flag` API restores SIGHUP/SIGTERM's
# default action outside the run loop, which tokio's handlers cannot.
signal-hook.workspace = true

[dev-dependencies]
rail-core = { workspace = true, features = ["test-gates"] }
tempfile.workspace = true
insta.workspace = true
reqwest.workspace = true
wiremock.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[lints]
workspace = true
